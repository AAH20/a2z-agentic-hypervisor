[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-agentic-hypervisor"
version = "1.1.0"
description = "Hardware-Accelerated Autonomous Agent Cyber Defense Hypervisor and Atomic Rollback Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Apex Growth Systems LLC", email = "aah@a2zsoc.com" }
]
keywords = [
    "autonomous-agents",
    "cyber-defense",
    "hypervisor",
    "rollback-engine",
    "nvidia-inception",
    "a2zsoc",
    "langchain",
    "hermes",
    "security",
    "zero-trust"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.scripts]
a2z-hypervisor = "a2z_agentic_hypervisor.cli:main"

[project.optional-dependencies]
nvidia = [
    "requests>=2.28.0"
]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
include = ["a2z_agentic_hypervisor*"]

[project.urls]
Homepage = "https://a2zsoc.com"
Repository = "https://github.com/AAH20/a2z-agentic-hypervisor"
Documentation = "https://a2zsoc.com/docs"
Issues = "https://github.com/AAH20/a2z-agentic-hypervisor/issues"
